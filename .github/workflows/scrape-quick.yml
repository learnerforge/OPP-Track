name: scrape-quick

# fullstack.md §11.6 — MANUAL ONLY spot run (workflow_dispatch, no schedule).
# Same guarded sequence as scrape-full.yml but a lighter scrape
# (--multi --validate): 10-20 min, for investigating or recovering a single
# source without a full pass.

on:
  workflow_dispatch:

concurrency:
  group: data-publish # shared with scrape-full: the two can never double-write
  cancel-in-progress: false

# See scrape-full.yml for why these two are the only grants (no secrets exist).
permissions:
  contents: write
  issues: write

env:
  TZ: UTC

jobs:
  scrape:
    name: quick scrape and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (.nvmrc pin, B22)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python 3.13 (pip cache on requirements.txt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned Python deps
        run: pip install -r requirements.txt

      - name: Cache ms-playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: Install Chromium + OS libraries (patchright, then playwright)
        run: |
          python -m patchright install --with-deps chromium
          python -m playwright install --with-deps chromium

      - name: Quick scrape (multi + validate)
        # --validate is a short-circuit (validates the EXISTING file and exits
        # without scraping) — it was silently turning this workflow into a no-op.
        # Quick pass = scrape listing pages only, no enrichment; npm gate below.
        run: python scripts/scrapers/run_all.py --multi --quick

      - name: Install npm dependencies
        run: npm ci

      - name: Node data validation (publish gate)
        run: npm run validate

      - name: Sanity / regression gate (E2)
        run: python scripts/sanity_gate.py --current data/scraped_opportunities.json --previous data/manifest.json

      - name: Publish dataset
        run: python scripts/publish_dataset.py --with-seeds

      - name: Commit and push published data (guarded, rebase-retry)
        shell: bash
        env:
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working tree clean - publish is a no-op, skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            data/scraped_opportunities.json \
            data/manifest.json \
            data/scraper_health.json \
            data/reports \
            public/data \
            src/lib/storage.ts

          if git diff --cached --quiet; then
            echo "No changes in the publish file set - skipping commit."
            exit 0
          fi

          SHA8="$(git rev-parse --short=8 HEAD)"
          COUNT="$(python - <<'PYEOF'
          import json

          with open("data/scraped_opportunities.json", encoding="utf-8") as fh:
              data = json.load(fh)
          if isinstance(data, list):
              items = data
          else:
              items = next((v for v in data.values() if isinstance(v, list)), [])
          print(len(items))
          PYEOF
          )"
          git commit -m "data: publish ${SHA8} (${COUNT} items)"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${PUBLISH_BRANCH}"; then
              echo "Pushed data publish to ${PUBLISH_BRANCH}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3) - rebasing on ${PUBLISH_BRANCH} and retrying."
            git pull --rebase origin "${PUBLISH_BRANCH}"
          done
          echo "Push failed after 3 attempts." >&2
          exit 1

      - name: Upload run artifacts (raw JSON + reports, 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ github.run_number }}
          path: |
            data/scraped_opportunities.json
            data/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Post-publish health poll (prod)
        if: ${{ vars.PROD_URL != '' }}
        run: curl -fsS --max-time 30 "${{ vars.PROD_URL }}/api/health"

      - name: Open or update the data-pipeline-alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Quick-pipeline run failed: ${RUN_URL}"
          if [ -f data/scraper_health.json ]; then
            DIGEST="$(python - <<'PYEOF'
          import json
          try:
              with open("data/scraper_health.json", encoding="utf-8") as fh:
                  h = json.load(fh)
          except Exception:
              raise SystemExit
          src = h.get("sources", {})
          blocked = sorted(k for k, v in src.items() if v.get("status") == "blocked")
          errored = sorted(k for k, v in src.items() if v.get("status") == "error")
          if blocked:
              print("- blocked (403/429/Cloudflare): " + ", ".join(blocked))
          if errored:
              print("- errored: " + ", ".join(errored))
          PYEOF
          )"
            if [ -n "${DIGEST}" ]; then
              BODY="${BODY}"$'\n\n'"Sources:"$'\n'"${DIGEST}"
            fi
          fi
          EXISTING="$(gh issue list --repo "${{ github.repository }}" --state open --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "data-pipeline-alert") | .number' | head -n 1 || true)"
          if [ -z "${EXISTING}" ]; then
            gh issue create --repo "${{ github.repository }}" --title "data-pipeline-alert" --body "${BODY}"
          else
            gh issue comment --repo "${{ github.repository }}" "${EXISTING}" --body "${BODY}"
          fi
