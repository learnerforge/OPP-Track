name: verify

# fullstack.md §11.6 row 1 — every push / PR: freeze check → typecheck → test →
# build → validate → python tests → sanity gate (best-effort until E2 lands).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — scripts/check_freeze.py needs merge-base history.
      - name: Checkout (full history for the freeze check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (.nvmrc pin, B22)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # No pip cache here: verify never installs Python deps (stdlib only),
      # and cache: pip errors in post-cleanup when the pip cache dir was
      # never created. The scrape workflows do pip-install, so theirs stands.
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install npm dependencies
        run: npm ci

      # Committed range only (never flags uncommitted work). PRs compare against
      # the PR base branch; pushes compare against the pushed-to-before SHA;
      # anything else falls back origin/main → origin/master → HEAD~1 → empty
      # tree inside the script (with a warning in the log).
      - name: src/ freeze check (fullstack.md §14.1)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_freeze.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            python scripts/check_freeze.py --base "${{ github.event.before }}"
          else
            python scripts/check_freeze.py
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Node data validation
        run: npm run validate

      # Python 3.13's unittest exits 5 ("NO TESTS RAN") when no test file
      # matches, so only run discovery once E2's tests/test_*.py exists; the
      # command itself is exactly the planned one. NOTE: tests must be
      # unittest.TestCase-based to be collected by discover (bare pytest
      # functions are not collected by unittest).
      - name: Python tests (unittest discovery)
        shell: bash
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s tests -p "test_*.py"
          else
            echo "No tests/test_*.py yet (milestone E2) - skipping unittest discovery."
          fi

      # Sanity gate is BLOCKING (E2 CLI confirmed 2026-10-19: --current /
      # --previous / --allow-init all exercised against the real 2,588-item
      # dataset during integration). The file-exists guard stays only so a
      # partial checkout fails loudly instead of with a python traceback.
      - name: Python sanity gate
        shell: bash
        run: |
          if [ -f scripts/sanity_gate.py ]; then
            python scripts/sanity_gate.py --current data/scraped_opportunities.json --allow-init
          else
            echo "scripts/sanity_gate.py not present yet (milestone E2) - skipping."
          fi
